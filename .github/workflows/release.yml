name: Release

# Si attiva pubblicando una Release (con un tag, es. v1.3.0) dalla pagina Releases del repository.
# Si puo' anche avviare a mano da Actions -> Release -> Run workflow: in quel caso i pacchetti restano tra gli artefatti.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # serve per allegare i file alla release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Costruzione dei pacchetti
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # evita il limite di 60 richieste/ora dell'API GitHub
        run: bash build/build_release.sh "${{ github.event.release.tag_name || 'dev' }}"
      - name: Allega i pacchetti alla release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/SHA256SUMS.txt --clobber
      - name: Pacchetti come artefatti (avvio manuale)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AFIP-Portable-pacchetti
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 7

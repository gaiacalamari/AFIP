name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test
        working-directory: src
        run: go test ./...
      - name: Compilazione per Windows
        working-directory: src
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" -o AFIP-Portable.exe .
      - name: Catalogo valido
        run: python3 -c "import json; d=json.load(open('manifest/tools.json', encoding='utf-8')); print(len(d['tools']), 'voci')"
      - uses: actions/upload-artifact@v4
        with:
          name: AFIP-Portable-exe
          path: src/AFIP-Portable.exe
          retention-days: 14
